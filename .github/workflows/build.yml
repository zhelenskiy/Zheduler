name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  # Any other branch builds on request rather than on every push: a run that packages every
  # platform is expensive, and the work branches here are pushed often.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request supersedes its own earlier run. A push to master is the thing someone
  # wants binaries from, and the next push must not take it down an hour in.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.format }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            path: composeApp/build/compose/binaries/main/deb/*.deb
            heap: 'org.gradle.jvmargs=-Xmx4g\nkotlin.daemon.jvmargs=-Xmx6g\n'
          - os: windows-latest
            format: msi
            path: composeApp/build/compose/binaries/main/msi/*.msi
            heap: 'org.gradle.jvmargs=-Xmx4g\nkotlin.daemon.jvmargs=-Xmx6g\n'
          - os: macos-latest
            format: dmg
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
            heap: 'org.gradle.jvmargs=-Xmx5g\nkotlin.daemon.jvmargs=-Xmx4g\n'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # gradle.properties asks for 10 GB of heap and then another 10 for the Kotlin daemon, which
      # a developer machine can promise and a runner cannot: this one reports 7937 MB and two
      # cores, and AGP's dexing workers want their share of that too. The published table says
      # 16 GB, which is the public-repository runner; a private repository gets this one.
      # Overcommitting gets the runner killed, which arrives as a cancelled job rather than as
      # an error. This file is the one Gradle reads ahead of the project's, and a nested run
      # reads it too.
      - name: Fit Gradle to the runner
        shell: bash
        run: |
          mkdir -p ~/.gradle
          printf '${{ matrix.heap }}' >> ~/.gradle/gradle.properties
      - name: Package
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: zheduler-desktop-${{ matrix.format }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # See the desktop job. Dexing a release build is the hungriest thing this repository asks
      # of a runner, and it runs in worker processes outside these two heaps.
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g\nkotlin.daemon.jvmargs=-Xmx6g\n' >> ~/.gradle/gradle.properties
      # The project holds no signing config, so the release APK comes out unsigned and only the
      # debug one installs as-is. Both are built to keep the release path honest.
      - name: Assemble
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: zheduler-android
          path: androidApp/build/outputs/apk/*/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The image default is several majors behind the Xcode this project is developed against.
      - name: Use the newest Xcode on the image
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version
      # See the desktop job — and here there is no command line of ours to put it on, since
      # xcodebuild is what starts Gradle, through the "Compile Kotlin Framework" phase.
      #
      # Do not lower these without watching this job. Linking the release framework runs
      # Kotlin/Native's devirtualization pass over the whole Compose graph, and it is the one
      # compilation in this repository that genuinely wants the room: at 3g it dies with
      # "Compilation failed: Java heap space".
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx5g\nkotlin.daemon.jvmargs=-Xmx4g\n' >> ~/.gradle/gradle.properties
      # A device build needs a signing certificate this repository has no way to hold, so the
      # artifact is the simulator app — the one iOS binary CI can produce and anyone can run.
      # The project shares no scheme, so the target is named directly, and that rules out
      # -derivedDataPath: xcodebuild takes it only alongside -scheme.
      - name: Build
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Zip the app bundle
        run: |
          app="$(find build/ios -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --keepParent "$app" zheduler-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zheduler-ios-simulator
          path: zheduler-ios-simulator.zip
          if-no-files-found: error

  web:
    name: Web ${{ matrix.target }} bundle
    runs-on: ubuntu-latest
    # Minifying the JS bundle takes half an hour on sixteen cores; the runner has four. The
    # wasm half is done in thirteen minutes, so the headroom costs nothing there.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One webpack per runner. Built together, the two of them took 55 minutes and then the
      # runner stopped answering the server — the failure GitHub reports when something starves
      # it. Terser over a Compose bundle is the expensive half, and doing one at a time keeps
      # each job to roughly half the work and half the exposure.
      matrix:
        include:
          - target: wasm
            compile: wasmJsProductionExecutableCompileSync
            task: wasmJsBrowserDistribution
            dist: wasmJs
          - target: js
            compile: jsProductionExecutableCompileSync
            task: jsBrowserDistribution
            dist: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The runner has 7937 MB, about a gigabyte of which is gone before the build starts. That
      # is the whole budget, and webpack wants roughly 4 GB of it to minify the JS bundle, so
      # the JVMs are held down to what the compile actually uses rather than what it might.
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx1500m\nkotlin.daemon.jvmargs=-Xmx2500m\n' >> ~/.gradle/gradle.properties
      # "Cannot rewrite paths in JavaScript source maps" in this job's log is a warning, not a
      # failure: the plugin copies the map through with its original paths and carries on.
      #
      # Two invocations with a stop between them, because the compile and the bundle want the
      # memory one after the other rather than together: once Kotlin has finished there is no
      # reason for its daemon to keep holding a couple of gigabytes while node asks for four.
      # The loop prints what is left every half minute — minifying is a silence long enough
      # that the job died inside it three times without saying why, and this is what finally
      # said it: 7907 of 7937 MB used, 29 MB free.
      - name: Bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # Two cores on this runner, one of which the agent needs to keep answering.
        run: |
          ( while true; do
              echo "$(date -u +%H:%M:%S)  $(free -m | awk '/^Mem:/ {print $3"/"$2" MB used, "$7" MB avail"}')  $(df -h / | awk 'NR==2 {print $4" disk free"}')"
              sleep 30
            done ) &
          watcher=$!
          trap 'kill $watcher 2>/dev/null || true' EXIT
          ./gradlew :composeApp:${{ matrix.compile }} --max-workers=2
          ./gradlew --stop
          ./gradlew :composeApp:${{ matrix.task }} --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: zheduler-web-${{ matrix.target }}
          path: composeApp/build/dist/${{ matrix.dist }}/productionExecutable
          if-no-files-found: error

  server:
    name: Server jar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g\nkotlin.daemon.jvmargs=-Xmx6g\n' >> ~/.gradle/gradle.properties
      - name: Build the fat jar
        run: ./gradlew :server:buildFatJar
      - uses: actions/upload-artifact@v4
        with:
          name: zheduler-server
          path: server/build/libs/*-all.jar
          if-no-files-found: error
